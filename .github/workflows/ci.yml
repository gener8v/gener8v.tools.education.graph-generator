name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} · React ${{ matrix.react }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        react: [18, 19]
    steps:
      # Actions are pinned to commit SHAs; Dependabot proposes updates (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: true
          node-version: ${{ matrix.node }}

      - name: Use React 18
        if: matrix.react == 18
        run: pnpm add --save-dev --save-exact react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generated files are up to date
        run: |
          if [ -f scripts/generate.ts ]; then
            pnpm generate
            changes="$(git status --porcelain -- src/generated tests/fixtures/generated docs/stories)"
            if [ -n "$changes" ]; then
              echo "Generated files are out of date or untracked; run pnpm generate and commit:"
              echo "$changes"
              exit 1
            fi
          else
            echo "scripts/generate.ts not present yet; nothing to check."
          fi

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          GRAPH_GENERATOR_PREBUILT: "1"

      - name: Benchmarks (GSV-NFR-001, NLC-NFR-008)
        run: pnpm bench
        env:
          GRAPH_GENERATOR_PREBUILT: "1"

      - name: Built output makes no network access
        run: pnpm check:dist

      - name: Package metadata (publint)
        run: pnpm publint

      - name: Type resolution (Are the Types Wrong)
        run: pnpm attw

      - name: Bundle size
        run: pnpm size

      - name: Runtime dependencies are justified
        run: pnpm check:deps

      - name: Image licenses are recorded
        run: pnpm check:images

      - name: Changesets carry a changelog category
        run: pnpm check:changesets

  # The workflow files (graph-library CPSE TICKET-009 QR-003). actionlint runs from its official image,
  # pinned by digest; the image holds shellcheck and pyflakes, so nothing else is downloaded.
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  # CPSE-NFR-005 and TR-002: every example hydrates in Chromium and WebKit with no warning, and
  # Node.js, Chromium and WebKit render the examples and generated descriptions to the same markup
  # (graph-library CPSE TICKET-004).
  e2e:
    name: Browsers · React ${{ matrix.react }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        react: [19, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: true

      - name: Use React 18
        if: matrix.react == 18
        run: pnpm add --save-dev --save-exact react@18.3.1 react-dom@18.3.1 @types/react@18.3.31 @types/react-dom@18.3.7

      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build
        run: pnpm build

      - name: Hydration and cross-engine markup (CPSE-NFR-005, TR-002)
        run: pnpm test:e2e

  # CPSE-NFR-003: the packed package installs into fresh React 18 and React 19 projects and renders
  # every example (graph-library CPSE TICKET-004).
  smoke:
    name: Install smoke · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: true
          node-version: ${{ matrix.node }}

      - name: Build
        run: pnpm build

      - name: Pack, install and render in React 18 and React 19 projects (CPSE-NFR-003)
        run: pnpm test:smoke
        env:
          GRAPH_GENERATOR_PREBUILT: "1"
