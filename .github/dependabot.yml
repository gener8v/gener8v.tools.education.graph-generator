version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the shared setup action they use (CPSE TICKET-009 quality review QR-005).
    directories: [/, /.github/actions/setup]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    # The smoke check's fresh React 18 and React 19 projects and their lockfiles (CPSE TICKET-004
    # security review SEC-001).
    directories: [/, /tests/smoke/react18, /tests/smoke/react19]
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1 (delivery DEL-004); move both together.
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
