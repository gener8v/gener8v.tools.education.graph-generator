version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript < 6.1 (delivery DEL-004); move both together.
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
